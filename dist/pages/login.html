<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng nhập - Vietnam Airlines</title>
  <link rel="stylesheet" crossorigin href="/assets/style-B4ZR7oau.css">
</head>

<body data-page="login" data-root="../">
    <header id="hdr"></header>
    <main class="wrap">
        <div class="card auth">
            <div class="tabs"><button type="button" data-r="user">Khách hàng</button><button type="button"
                    data-r="admin">Quản trị viên</button></div>
            <h2 id="ltitle"></h2>
            <form id="lf" novalidate><label>Email<input name="email" type="email"
                        autocomplete="username"></label><label>Mật khẩu<input name="pass" type="password"
                        autocomplete="current-password"></label>
                <div id="lmsg"></div><button class="btn">Đăng nhập</button>
            </form>
            <p id="reg" style="text-align:center">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p><small>Demo:
                user@vna.vn / 123456 · admin@vna.vn / admin123</small>
        </div>
    </main>
    <footer id="ftr"></footer>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/product.js"></script>
    <script src="../js/booking.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/contact.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
