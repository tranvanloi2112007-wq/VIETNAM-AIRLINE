<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Lý Đặt Vé & Chuyến Bay - Admin</title>
    <!-- Sử dụng Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-blue-900 text-white shadow-md">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold"><i class="fa-solid fa-plane-up mr-2"></i>Admin Dashboard - Quản Lý Hàng Không</h1>
                <span class="text-sm bg-blue-800 px-3 py-1 rounded-full"><i class="fa-solid fa-user-shield mr-1"></i> Quản trị viên</span>
            </div>
        </header>

        <div class="flex items-center space-x-4">
    <span class="text-sm bg-blue-800 px-3 py-1 rounded-full"><i class="fa-solid fa-user-shield mr-1"></i> Quản trị viên</span>
    <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
    </button>
</div>

        <!-- Main Content -->
        <main class="container mx-auto px-6 py-8 flex-grow space-y-10">

            <!-- PHẦN 1: QUẢN LÝ ĐẶT VÉ -->
            <section class="bg-white rounded-lg shadow-md p-6">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-ticket mr-2 text-blue-600"></i>Danh sách Đặt Vé</h2>
                    <div class="w-full md:w-1/3 relative">
                        <input type="text" id="searchBookingInput" placeholder="Tìm theo mã đặt chỗ hoặc tên hành khách..." 
                            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
                        <thead class="bg-gray-50 text-gray-700 uppercase font-semibold">
                            <tr>
                                <th class="px-6 py-3">Mã Đặt Chỗ</th>
                                <th class="px-6 py-3">Hành Khách</th>
                                <th class="px-6 py-3">Chuyến Bay</th>
                                <th class="px-6 py-3">Ghế / Hạng</th>
                                <th class="px-6 py-3">Trạng Thái</th>
                                <th class="px-6 py-3 text-center">Hành Động</th>
                            </tr>
                        </thead>
                        <tbody id="bookingTableBody" class="divide-y divide-gray-200 text-gray-600"></tbody>
                    </table>
                </div>
            </section>

            <!-- PHẦN 2: THÊM CHUYẾN BAY MỚI (Lấy dữ liệu từ người dùng) -->
            <section class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fa-solid fa-circle-plus mr-2 text-blue-600"></i>Thêm Chuyến Bay Mới</h2>
                <form id="addFlightForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 text-sm">
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">Mã Chuyến Bay</label>
                        <input type="text" id="newFlightCode" placeholder="VD: VN-9999" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">Tuyến Đường</label>
                        <input type="text" id="newFlightRoute" placeholder="SGN → HAN" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">Thời Gian Khởi Hành</label>
                        <input type="text" id="newFlightTime" placeholder="08:30 - 10:45 | 20/06/2026" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">Giá Vé (VNĐ)</label>
                        <input type="number" id="newFlightPrice" placeholder="1500000" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-4 flex justify-end">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium transition">
                            <i class="fa-solid fa-save mr-1"></i> Thêm Chuyến Bay
                        </button>
                    </div>
                </form>
            </section>

            <!-- PHẦN 3: QUẢN LÝ CHUYẾN BAY MẪU (Sửa / Xóa) -->
            <section class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-6"><i class="fa-solid fa-plane mr-2 text-blue-600"></i>Quản Lý Chuyến Bay Mẫu</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
                        <thead class="bg-gray-50 text-gray-700 uppercase font-semibold">
                            <tr>
                                <th class="px-6 py-3">Mã Chuyến Bay</th>
                                <th class="px-6 py-3">Tuyến Đường</th>
                                <th class="px-6 py-3">Giờ Khởi Hành</th>
                                <th class="px-6 py-3">Giá Vé (VNĐ)</th>
                                <th class="px-6 py-3 text-center">Hành Động</th>
                            </tr>
                        </thead>
                        <tbody id="flightTableBody" class="divide-y divide-gray-200 text-gray-600"></tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- MODAL SỬA CHUYẾN BAY -->
    <div id="editFlightModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 relative">
            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-pen-to-square mr-2 text-blue-600"></i>Sửa Thông Tin Chuyến Bay</h3>
            <form id="editFlightForm" class="space-y-4 text-sm">
                <input type="hidden" id="editFlightId">
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Mã Chuyến Bay</label>
                    <input type="text" id="editFlightCode" disabled class="w-full border bg-gray-100 rounded px-3 py-2 text-gray-500">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Tuyến Đường</label>
                    <input type="text" id="editFlightRoute" required class="w-full border rounded px-3 py-2">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Thời Gian Khởi Hành</label>
                    <input type="text" id="editFlightTime" required class="w-full border rounded px-3 py-2">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Giá Vé (VNĐ)</label>
                    <input type="number" id="editFlightPrice" required class="w-full border rounded px-3 py-2">
                </div>
                <div class="mt-6 flex justify-end space-x-2">
                    <button type="button" id="closeEditModalBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded">Hủy</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Nhúng file Logic JavaScript dưới dạng ES6 Module -->
    <script type="module" src="/js/features/admin-management.js"></script>
</body>
</html>
