<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Vietnam Airline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style/register.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-900 mb-6"><i class="fa-solid fa-user-plus mr-2"></i>Đăng Ký Tài Khoản</h2>
        
        <form id="registerForm" class="space-y-4 text-sm">
            <div>
                <label class="block font-medium text-gray-700 mb-1">Họ và Tên</label>
                <input type="text" id="regName" placeholder="Nguyễn Văn A" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="regEmail" placeholder="name@example.com" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="regPassword" placeholder="••••••••" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">Đăng Ký</button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">
            Đã có tài khoản? <a href="/pages/login.html" class="text-blue-600 hover:underline font-medium">Đăng nhập ngay</a>
        
        </p>
        
         
        
    </div>

    <script type="module" src="/js/register.js"></script>
</body>
</html>
