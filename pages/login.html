<!DOCTYPE html>

<head>

</head>
<body>

    <p>
        Chưa có tài khoản?
        <a href="./register.html">Đăng ký</a>
    </p>
    <div> <a href="../index.html">Trở về!</a> </div>

    <p id="message"></p>
</div>

<script src="./js/login.js"></script>
</body>
</html>
