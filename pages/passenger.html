<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Thông tin hành khách - Vietnam Airlines</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="passenger" data-root="../">
    <header id="hdr"></header>
    <main class="wrap">
        <h2>Thông tin hành khách</h2>
        <form id="pf" novalidate>
            <div id="pf-list"></div>
            <fieldset>
                <legend>Thông tin liên hệ</legend>
                <div class="grid">
                    <label>
                        Số điện thoại<input id="phone" type="tel">
                    </label>
                    <label>
                        Email<input id="email" type="email">
                    </label>
                </div>
            </fieldset>
            <button class="btn">Tiếp tục</button>
        </form>
    </main>
    <footer id="ftr"></footer>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/product.js"></script>
    <script src="../js/booking.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/contact.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
